[tool.poetry]
name = "payment-processing"
version = "0.1.0"
description = "Multithread payment processing"
package-mode = false
authors = ["Roman Muradyan <murrometz@gmail.com>"]

# === Workspace modules ===
[tool.poetry.workspace]
members = [
    "app/core",
    "app/database",
    "app/api",
    "app/consumer",
    "app/messaging"
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

# Deps
[tool.poetry.dependencies]
python = "^3.11"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.3"
pytest-asyncio = "^0.21.1"