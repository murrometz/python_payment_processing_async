[tool.poetry]
name = "payment-core"
version = "0.1.0"
description = "Core domain models and schemas for payment processing"

[tool.poetry.dependencies]
python = "^3.11"
# SQLAlchemy is needed for the Base class and database mapping
sqlalchemy = "^2.0.23"
# Pydantic is required for Enums and BaseModel inheritance in schemas
pydantic = "^2.5.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"